[project]
name = "xthread2social"
version = "0.1.0"
description = "Republish an X thread to your own Bluesky and Mastodon accounts"
requires-python = ">=3.10"
dependencies = ["atproto>=0.0.55,<0.1", "pillow>=10"]

[project.optional-dependencies]
graphemes = ["regex>=2024.0"]

[project.scripts]
xthread2social = "xthread2social.cli:main"
xthread2social-serve = "xthread2social.serve:main"

[tool.setuptools]
packages = ["xthread2social"]
